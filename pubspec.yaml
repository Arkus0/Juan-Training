name: juan_training
description: App de rutinas personalizadas.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Drift / SQLite
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  path: ^1.9.0
  collection: ^1.18.0

  # Dependencies requested
  # hive: ^2.2.3  <-- Removed
  # hive_flutter: ^1.1.0 <-- Removed
  shared_preferences: ^2.2.0
  path_provider: ^2.1.1
  uuid: ^4.2.1
  timer_count_down: ^2.2.2
  intl: ^0.19.0
  http: ^1.2.0
  logger: ^2.0.0
  image: ^4.0.17

  # UI & UX
  flutter_riverpod: ^2.6.1
  flutter_vibrate: ^1.3.0
  reorderables: ^0.6.0
  implicitly_animated_reorderable_list: ^0.4.0
  google_fonts: ^6.1.0
  connectivity_plus: ^6.1.0
  fuzzy: ^0.5.0

  # Icons
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  # hive_generator: ^2.0.1 <-- Removed
  drift_dev: ^2.16.0

flutter:
  uses-material-design: true
  assets:
    - assets/img/
    - assets/img/ejercicios/
    - assets/data/exercises.json
    - assets/fonts/

google_fonts:
  use_google_fonts_v2: true
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Montserrat-Black.ttf
          weight: 900
