name: juan_training
description: App de rutinas personalizadas.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Drift / SQLite
  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.5.28
  path: ^1.9.0
  collection: ^1.19.0

  # Storage & Utils
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  uuid: ^4.5.1
  intl: ^0.20.2
  http: ^1.2.2
  logger: ^2.5.0

  # UI & UX
  flutter_riverpod: ^2.6.1

  # Charts & Analytics UI
  fl_chart: ^0.69.2
  table_calendar: ^3.2.0
  percent_indicator: ^4.2.3
  google_fonts: ^6.3.3
  connectivity_plus: ^6.1.5
  fuzzy: ^0.5.1
  share_plus: ^10.1.4
  screenshot: ^3.0.0
  url_launcher: ^6.3.1

  # OCR & Image Import
  google_mlkit_text_recognition: ^0.14.0  # google_mlkit_commons actualizado a 0.9.0
  image_picker: ^1.1.2

  # Audio (para beeps del timer - ligero, offline-first)
  just_audio: ^0.9.42

  # Speech Recognition (on-device, offline-first para dictado de rutinas)
  speech_to_text: ^7.0.0

  # Notifications & Background Timer (lock screen timer)
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.3.1

  # Swipe Actions (para duplicar/eliminar ejercicios en editor)
  flutter_slidable: ^3.1.1

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.22.0

flutter:
  uses-material-design: true
  assets:
    - assets/img/
    - assets/img/ejercicios/
    - assets/data/exercises.json
    - assets/data/alternativas.json
    - assets/fonts/

google_fonts:
  use_google_fonts_v2: true
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Montserrat-Black.ttf
          weight: 900
