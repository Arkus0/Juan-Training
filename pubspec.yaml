name: juan_training
description: App de rutinas personalizadas.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Dependencies requested
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  uuid: ^4.2.1
  timer_count_down: ^2.2.2
  intl: ^0.19.0  # Updated to latest stable
  http: ^1.2.0
  logger: ^2.0.0

  # New dependencies
  flutter_riverpod: ^2.6.1 # Updated for 2026 readiness
  flutter_vibrate: ^1.3.0
  audioplayers: ^5.2.1
  connectivity_plus: ^6.1.0 # Updated to v6
  fuzzy: ^0.5.0
  google_fonts: ^6.1.0

  # Icons
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0 # Updated lints
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
