name: juan_training
description: App de rutinas personalizadas.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Drift / SQLite
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  path: ^1.9.0
  collection: ^1.18.0

  # Dependencies requested
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  uuid: ^4.2.1
  timer_count_down: ^2.2.2
  intl: ^0.19.0
  http: ^1.2.0
  logger: ^2.0.0

  # UI & UX
  flutter_riverpod: ^2.6.1
  flutter_vibrate: ^1.3.0
  audioplayers: ^5.2.1
  reorderables: ^0.6.0
  google_fonts: ^6.1.0
  connectivity_plus: ^6.1.0
  fuzzy: ^0.5.0

  # Icons
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  drift_dev: ^2.16.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/img/
    - assets/img/ejercicios/
