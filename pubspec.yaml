name: juan_training
description: App de rutinas personalizadas.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Drift / SQLite
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  path: ^1.9.0
  collection: ^1.18.0

  # Dependencies requested
  # hive: ^2.2.3  <-- Removed
  # hive_flutter: ^1.1.0 <-- Removed
  shared_preferences: ^2.2.0
  path_provider: ^2.1.1
  uuid: ^4.2.1
  timer_count_down: ^2.2.2
  intl: ^0.19.0
  http: ^1.2.0
  logger: ^2.0.0
  image: ^4.0.17

  # UI & UX
  flutter_riverpod: ^2.6.1
  # flutter_vibrate removed: replaced by Flutter's built-in HapticFeedback
  # flutter_vibrate: ^1.3.0
  reorderables: ^0.6.0

  # Charts & Analytics UI
  fl_chart: ^0.66.0
  table_calendar: ^3.1.0
  percent_indicator: ^4.2.3
  implicitly_animated_reorderable_list: ^0.4.0
  google_fonts: ^6.1.0
  connectivity_plus: ^6.1.0
  fuzzy: ^0.5.0
  share_plus: ^7.2.1
  screenshot: ^3.0.0
  url_launcher: ^6.2.0

  # OCR & Image Import
  google_mlkit_text_recognition: ^0.13.0
  image_picker: ^1.0.7

  # Audio (para beeps del timer - ligero, offline-first)
  just_audio: ^0.9.36

  # Speech Recognition (on-device, offline-first para dictado de rutinas)
  # Justificación: speech_to_text usa motores nativos (iOS Speech, Android SpeechRecognizer)
  # que funcionan offline sin enviar audio a la nube. Ideal para gym ruidoso con privacidad.
  speech_to_text: ^7.0.0

  # Notifications & Background Timer (lock screen timer)
  flutter_local_notifications: ^17.2.4
  permission_handler: ^11.3.1

  # Swipe Actions (para duplicar/eliminar ejercicios en editor)
  flutter_slidable: ^3.1.1

  # Icons
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  # hive_generator: ^2.0.1 <-- Removed
  drift_dev: ^2.16.0

flutter:
  uses-material-design: true
  assets:
    - assets/img/
    - assets/img/ejercicios/
    - assets/data/exercises.json
    - assets/data/alternativas.json
    - assets/fonts/

google_fonts:
  use_google_fonts_v2: true
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Montserrat-Black.ttf
          weight: 900
